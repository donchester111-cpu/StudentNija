<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>StudentNija · Sign in</title>
  <style>
    :root {
      --bg-primary: #0A111F;
      --bg-secondary: #121C28;
      --text-primary: #F0F4FA;
      --text-muted: #8FA0B5;
      --card-bg: rgba(255, 255, 255, 0.04);
      --border-light: rgba(255, 255, 255, 0.06);
      --shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
      --accent: #008751;
      --accent-light: #00A86B;
      --radius: 28px;
      --transition: 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    body.light-theme {
      --bg-primary: #F0F4FA;
      --bg-secondary: #FFFFFF;
      --text-primary: #0A1927;
      --text-muted: #5B6E8C;
      --card-bg: rgba(255, 255, 255, 0.65);
      --border-light: rgba(0, 0, 0, 0.06);
      --shadow: 0 8px 40px rgba(0, 0, 0, 0.07);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
      text-align: center;
      transition: background var(--transition), color var(--transition);
      background-image: radial-gradient(ellipse at 50% 0%, var(--accent-glow) 0%, transparent 70%);
    }
    .container {
      max-width: 400px;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius);
      padding: 44px 28px 32px;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow);
      transition: background var(--transition), box-shadow var(--transition), border-color var(--transition);
      animation: fadeUp 0.6s ease forwards;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo { font-size: 72px; display: inline-block; filter: drop-shadow(0 8px 32px var(--accent-glow)); animation: float 6s ease-in-out infinite; line-height: 1; margin-bottom: 4px; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px; background: linear-gradient(135deg, var(--text-primary) 40%, var(--accent-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .sub { font-size: 15px; color: var(--text-muted); margin-bottom: 28px; font-weight: 400; }
    #status { margin: 8px 0 16px; font-size: 14px; color: var(--text-muted); min-height: 24px; transition: color 0.2s; }
    .spinner { width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; margin: 8px auto; display: none; }
    .spinner.show { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 480px) { .container { padding: 32px 18px 24px; } .logo { font-size: 56px; } h1 { font-size: 24px; } .sub { font-size: 14px; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🇳🇬</div>
    <h1>StudentNija</h1>
    <p class="sub">Signing you in...</p>
    <div id="status">Loading</div>
    <div class="spinner show" id="spinner"></div>
  </div>

  <script>
    (function() {
      'use strict';

      // ---- CONFIG ----
      const CLIENT_ID = '738668428340-gpf3ctm26fkfpj441ra00ra1h65gelov.apps.googleusercontent.com';
      const REDIRECT_URI = window.location.href.split('?')[0]; // current page URL
      const SCOPE = 'email profile';
      const API_BASE = 'https://studentnija-public-chat.onrender.com';
      const statusEl = document.getElementById('status');
      const spinner = document.getElementById('spinner');

      // ---- THEME SYNC ----
      function loadTheme() {
        const APP_KEY = 'studentnija_settings';
        let theme = null;
        try {
          const appRaw = localStorage.getItem(APP_KEY);
          if (appRaw) {
            const appSettings = JSON.parse(appRaw);
            if (appSettings.theme) theme = appSettings.theme;
          }
        } catch (_) {}
        if (!theme) {
          const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          theme = prefersLight ? 'light' : 'dark';
        }
        document.body.classList.toggle('light-theme', theme === 'light');
      }
      loadTheme();

      // ---- Helper: Exchange Google access token for a JWT from backend ----
      async function exchangeToken(accessToken) {
        try {
          const res = await fetch(`${API_BASE}/api/auth/google-token`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ accessToken })
          });
          const data = await res.json();
          if (data.success) {
            return data;
          } else {
            throw new Error(data.error || 'Token exchange failed');
          }
        } catch (e) {
          statusEl.textContent = '❌ Server error: ' + e.message;
          spinner.classList.remove('show');
          throw e;
        }
      }

      // ---- Complete login after obtaining token and user ----
      function completeLogin(token, user) {
        // Store JWT and user
        localStorage.setItem('studentnija_jwt', token);
        localStorage.setItem('studentnija_currentUser', JSON.stringify(user));
        sessionStorage.setItem('studentnija_jwt', token);

        statusEl.textContent = '✅ Sign‑in successful! Redirecting...';
        spinner.classList.add('show');

        setTimeout(() => {
          window.location.replace('index.html');
        }, 400);
      }

      // ---- Process token from URL (backend OAuth) or hash (client-side OAuth) ----
      function processTokens() {
        // 1) Check for backend token in URL query
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const userData = params.get('user');
        if (token && userData) {
          try {
            const user = JSON.parse(decodeURIComponent(userData));
            completeLogin(token, user);
            return true;
          } catch (e) {
            statusEl.textContent = '❌ Error parsing user data.';
            console.error(e);
            return false;
          }
        }

        // 2) Check for client-side OAuth token in URL hash
        if (window.location.hash) {
          const hash = window.location.hash.substring(1);
          const params = new URLSearchParams(hash);
          const accessToken = params.get('access_token');
          const error = params.get('error');

          if (error) {
            statusEl.textContent = '❌ Error: ' + error;
            spinner.classList.remove('show');
            return false;
          } else if (accessToken) {
            // Fetch user info from Google
            statusEl.textContent = '⏳ Fetching your profile...';
            spinner.classList.add('show');
            fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
              headers: { Authorization: 'Bearer ' + accessToken }
            })
            .then(res => {
              if (!res.ok) throw new Error('Failed to fetch user info');
              return res.json();
            })
            .then(async (data) => {
              // Build user object
              const user = {
                id: 'user_' + Date.now(),
                fullName: data.name || data.given_name || 'Google User',
                email: data.email,
                profilePicture: data.picture || '',
                school: '',
                department: '',
                level: '',
                bio: '',
                googleAuth: true
              };
              // Exchange the access token for a JWT
              statusEl.textContent = '⏳ Authenticating with server...';
              const exchange = await exchangeToken(accessToken);
              if (exchange.success) {
                completeLogin(exchange.token, user);
              } else {
                // Fallback: if exchange fails, store user without JWT (local only)
                localStorage.setItem('studentnija_currentUser', JSON.stringify(user));
                statusEl.textContent = '✅ Signed in (local only). Redirecting...';
                setTimeout(() => {
                  window.location.replace('index.html');
                }, 400);
              }
            })
            .catch(err => {
              statusEl.textContent = '❌ Error: ' + err.message;
              spinner.classList.remove('show');
            });
            return true;
          }
        }
        return false;
      }

      // ---- Auto-start OAuth flow if no token found ----
      function startOAuth() {
        statusEl.textContent = '⏳ Redirecting to Google...';
        spinner.classList.add('show');
        const authUrl = `https://accounts.google.com/o/oauth2/v2/auth` +
          `?client_id=${encodeURIComponent(CLIENT_ID)}` +
          `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
          `&response_type=token` +
          `&scope=${encodeURIComponent(SCOPE)}` +
          `&prompt=select_account`;
        window.location.href = authUrl;
      }

      // ---- INIT ----
      const handled = processTokens();
      if (!handled) {
        // No token found – start OAuth flow automatically
        startOAuth();
      }
    })();
  </script>
</body>
</html>
