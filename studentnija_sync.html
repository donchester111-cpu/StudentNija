<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sign in with Google</title>
    <style>
        /* ---- Theme variables (synced with main app) ---- */
        :root {
            --bg-primary: #0A111F;
            --bg-secondary: #121C28;
            --text-primary: #F0F4FA;
            --text-muted: #8FA0B5;
            --card-bg: rgba(255, 255, 255, 0.04);
            --border-light: rgba(255, 255, 255, 0.06);
            --shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.3);
            --accent: #008751;
            --accent-light: #00A86B;
            --accent-glow: rgba(0, 135, 81, 0.25);
            --radius: 28px;
            --transition: 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        body.light-theme {
            --bg-primary: #F0F4FA;
            --bg-secondary: #FFFFFF;
            --text-primary: #0A1927;
            --text-muted: #5B6E8C;
            --card-bg: rgba(255, 255, 255, 0.65);
            --border-light: rgba(0, 0, 0, 0.06);
            --shadow: 0 8px 40px rgba(0, 0, 0, 0.07);
            --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.04);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
            text-align: center;
            transition: background var(--transition), color var(--transition);
            background-image: radial-gradient(ellipse at 50% 0%, var(--accent-glow) 0%, transparent 70%);
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius);
            padding: 44px 28px 32px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow);
            transition: background var(--transition), box-shadow var(--transition), border-color var(--transition);
            animation: fadeUp 0.6s ease forwards;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo { font-size: 72px; display: inline-block; filter: drop-shadow(0 8px 32px var(--accent-glow)); animation: float 6s ease-in-out infinite; line-height: 1; margin-bottom: 4px; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px; background: linear-gradient(135deg, var(--text-primary) 40%, var(--accent-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .sub { font-size: 15px; color: var(--text-muted); margin-bottom: 28px; font-weight: 400; }
        #status { margin: 8px 0 16px; font-size: 14px; color: var(--text-muted); min-height: 24px; transition: color 0.2s; }
        .google-btn { display: flex; align-items: center; justify-content: center; gap: 14px; width: 100%; padding: 16px 20px; border-radius: 60px; background: #ffffff; color: #0A111F; border: none; font-weight: 600; font-size: 16px; cursor: pointer; transition: transform 0.15s, box-shadow 0.2s, background 0.2s; font-family: inherit; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
        .google-btn:hover { background: #f5f5f5; }
        .google-btn:active { transform: scale(0.96); }
        .google-btn img { width: 22px; height: 22px; }
        .back-link { display: inline-block; margin-top: 20px; color: var(--text-muted); font-size: 14px; cursor: pointer; text-decoration: none; transition: color 0.2s; font-weight: 500; padding: 6px 12px; border-radius: 30px; background: rgba(255,255,255,0.03); }
        .back-link:hover { color: var(--text-primary); background: rgba(255,255,255,0.06); }
        .spinner { width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; margin: 8px auto; display: none; }
        .spinner.show { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 480px) { .container { padding: 32px 18px 24px; } .logo { font-size: 56px; } h1 { font-size: 24px; } .sub { font-size: 14px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🇳🇬</div>
        <h1>StudentNija</h1>
        <p class="sub">Sign in with your Google account</p>
        <div id="status">Click the button below to sign in.</div>
        <div class="spinner" id="spinner"></div>
        <button class="google-btn" id="signInBtn">
            <img src="https://www.google.com/favicon.ico" alt="Google" />
            Sign in with Google
        </button>
        <a class="back-link" id="backLink">← Go back</a>
    </div>

    <script>
        (function() {
            'use strict';

            // ---- CONFIGURATION ----
            const CLIENT_ID = '738668428340-gpf3ctm26fkfpj441ra00ra1h65gelov.apps.googleusercontent.com';
            const REDIRECT_URI = 'https://studentnija.pages.dev/studentnija_sync.html';
            const SCOPE = 'email profile';

            // ---- DOM refs ----
            const statusEl = document.getElementById('status');
            const spinner = document.getElementById('spinner');
            const signInBtn = document.getElementById('signInBtn');
            const backLink = document.getElementById('backLink');

            // ---- THEME SYNC – read from main app storage ----
            function loadTheme() {
                const APP_KEY = 'studentnija_settings';
                const CHAT_KEY = 'studentnija_chat_settings_v3';
                let theme = null;
                try {
                    const appRaw = localStorage.getItem(APP_KEY);
                    if (appRaw) {
                        const appSettings = JSON.parse(appRaw);
                        if (appSettings.theme) theme = appSettings.theme;
                    }
                } catch (_) {}
                if (!theme) {
                    try {
                        const chatRaw = localStorage.getItem(CHAT_KEY);
                        if (chatRaw) {
                            const chatSettings = JSON.parse(chatRaw);
                            if (chatSettings.theme) theme = chatSettings.theme;
                        }
                    } catch (_) {}
                }
                if (!theme) {
                    const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
                    theme = prefersLight ? 'light' : 'dark';
                }
                document.body.classList.toggle('light-theme', theme === 'light');
            }
            loadTheme();
            window.addEventListener('storage', function(e) {
                if (e.key === APP_KEY || e.key === CHAT_KEY) loadTheme();
            });

            // ---- If this page is loaded in a popup and has a URL fragment (token response) ----
            if (window.opener && window.location.hash) {
                const hash = window.location.hash.substring(1);
                const params = new URLSearchParams(hash);
                const accessToken = params.get('access_token');
                const error = params.get('error');

                if (error) {
                    window.opener.postMessage({ type: 'google_oauth_response', error: error }, '*');
                } else if (accessToken) {
                    window.opener.postMessage({ type: 'google_oauth_response', access_token: accessToken }, '*');
                } else {
                    window.opener.postMessage({ type: 'google_oauth_response', error: 'No token received' }, '*');
                }
                window.close();
                throw new Error('Popup closed');
            }

            // ---- Helper: fetch user info from Google ----
            async function fetchUserInfo(accessToken) {
                try {
                    const response = await fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
                        headers: { Authorization: 'Bearer ' + accessToken }
                    });
                    if (!response.ok) throw new Error('Failed to fetch user info');
                    const data = await response.json();
                    const userData = {
                        email: data.email,
                        name: data.name || data.given_name || 'Google User',
                        picture: data.picture || ''
                    };

                    // ---- Save to localStorage (fallback) ----
                    localStorage.setItem('studentnija_user', JSON.stringify(userData));

                    // ---- Send to opener via postMessage (primary) ----
                    if (window.opener && !window.opener.closed) {
                        window.opener.postMessage({
                            type: 'google_login_success',
                            user: userData
                        }, window.location.origin);
                        statusEl.textContent = '✅ Login successful! Returning to app...';
                        spinner.classList.remove('show');
                        setTimeout(() => window.close(), 500);
                    } else {
                        // Standalone mode – show success and allow user to close
                        statusEl.textContent = '✅ Login successful! You can close this window.';
                        spinner.classList.remove('show');
                        setTimeout(() => window.close(), 2000);
                    }
                } catch (err) {
                    statusEl.textContent = '❌ Error: ' + err.message;
                    spinner.classList.remove('show');
                }
            }

            // ---- Start OAuth flow (implicit) ----
            function startOAuth() {
                statusEl.textContent = '⏳ Opening sign-in window...';
                spinner.classList.add('show');

                const authUrl = `https://accounts.google.com/o/oauth2/v2/auth` +
                    `?client_id=${encodeURIComponent(CLIENT_ID)}` +
                    `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
                    `&response_type=token` +
                    `&scope=${encodeURIComponent(SCOPE)}` +
                    `&prompt=select_account`;

                const popup = window.open(authUrl, '_blank', 'width=500,height=600');
                if (!popup) {
                    statusEl.textContent = '❌ Popup blocked. Please allow popups for this site.';
                    spinner.classList.remove('show');
                    return;
                }

                const handleMessage = (event) => {
                    if (event.data && event.data.type === 'google_oauth_response') {
                        const { access_token, error } = event.data;
                        if (error) {
                            statusEl.textContent = '❌ Error: ' + error;
                            spinner.classList.remove('show');
                        } else if (access_token) {
                            fetchUserInfo(access_token);
                        }
                        window.removeEventListener('message', handleMessage);
                    }
                };
                window.addEventListener('message', handleMessage);

                setTimeout(() => {
                    window.removeEventListener('message', handleMessage);
                }, 120000);
            }

            // ---- Init ----
            signInBtn.addEventListener('click', startOAuth);

            backLink.addEventListener('click', function() {
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.close();
                }
            });

            console.log('✅ StudentNija OAuth page loaded.');
        })();
    </script>
</body>
</html>
