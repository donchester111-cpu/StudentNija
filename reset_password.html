<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StudentNija · Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg-primary: #0A111F; --bg-secondary: #121C28;
      --bg-card: rgba(255,255,255,0.04); --text-primary: #F0F4FA;
      --text-muted: #8FA0B5; --accent: #008751; --accent-light: #00A86B;
      --accent-glow: rgba(0,135,81,0.3); --shadow: 0 8px 40px rgba(0,0,0,0.5);
      --radius: 24px; --radius-sm: 14px;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-primary); color: var(--text-primary);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--bg-secondary); backdrop-filter: blur(20px);
      border-radius: var(--radius); padding: 32px 28px; max-width: 400px;
      width: 100%; border: 1px solid rgba(255,255,255,0.06);
      box-shadow: var(--shadow); text-align: center;
    }
    h2 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    p { color: var(--text-muted); margin-bottom: 24px; font-size: 14px; }
    input {
      width: 100%; padding: 12px 16px; border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04);
      color: var(--text-primary); font-size: 14px; outline: none; margin: 8px 0;
      font-family: inherit;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .btn {
      width: 100%; padding: 14px; border-radius: 30px; border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: white; font-weight: 700; font-size: 16px; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 12px var(--accent-glow); margin-top: 12px;
    }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.5; transform: none; cursor: not-allowed; }
    .error { color: #ff4444; font-size: 13px; margin-top: 8px; display: none; }
    .success { color: var(--accent-light); font-size: 14px; margin-top: 12px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔐 Reset Password</h2>
    <p>Enter your new password below.</p>

    <div id="formSection">
      <input type="password" id="newPassword" placeholder="New password">
      <input type="password" id="confirmPassword" placeholder="Confirm new password">
      <button class="btn" id="resetBtn">Reset Password</button>
      <div class="error" id="errorMsg"></div>
    </div>

    <div class="success" id="successMsg">Password changed! Redirecting to login...</div>
  </div>

  <script>
    (function() {
      const BACKEND_URL = 'https://studentnija-public-chat.onrender.com';
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const userId = params.get('userId');

      const formSection = document.getElementById('formSection');
      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');
      const resetBtn = document.getElementById('resetBtn');
      const newPassword = document.getElementById('newPassword');
      const confirmPassword = document.getElementById('confirmPassword');

      if (!token || !userId) {
        formSection.innerHTML = '<p class="error" style="display:block;">Invalid reset link. Please request a new one.</p>';
        return;
      }

      resetBtn.addEventListener('click', async () => {
        const pw = newPassword.value;
        const confirm = confirmPassword.value;

        if (!pw || pw.length < 4) {
          errorMsg.textContent = 'Password must be at least 4 characters.';
          errorMsg.style.display = 'block';
          return;
        }
        if (pw !== confirm) {
          errorMsg.textContent = 'Passwords do not match.';
          errorMsg.style.display = 'block';
          return;
        }

        resetBtn.disabled = true;
        resetBtn.textContent = 'Resetting...';
        errorMsg.style.display = 'none';

        try {
          const res = await fetch(`${BACKEND_URL}/api/auth/reset-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, token, newPassword: pw })
          });
          const data = await res.json();

          if (data.success) {
            // Update local storage
            const currentUser = JSON.parse(localStorage.getItem('studentnija_currentUser') || '{}');
            if (currentUser && currentUser.email === data.email) {
              currentUser.password = pw;
              localStorage.setItem('studentnija_currentUser', JSON.stringify(currentUser));
            }
            const users = JSON.parse(localStorage.getItem('studentnija_users') || '[]');
            const idx = users.findIndex(u => u.email === data.email);
            if (idx !== -1) {
              users[idx].password = pw;
              localStorage.setItem('studentnija_users', JSON.stringify(users));
            }

            formSection.style.display = 'none';
            successMsg.style.display = 'block';
            setTimeout(() => {
              window.location.href = 'index.html';
            }, 2500);
          } else {
            errorMsg.textContent = data.error || 'Reset failed. The link may be expired.';
            errorMsg.style.display = 'block';
          }
        } catch (e) {
          errorMsg.textContent = 'Network error. Please try again.';
          errorMsg.style.display = 'block';
        } finally {
          resetBtn.disabled = false;
          resetBtn.textContent = 'Reset Password';
        }
      });
    })();
  </script>
</body>
</html>
